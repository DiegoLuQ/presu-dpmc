version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcdp_backend
    restart: always
    # nginx-proxy enrutará el tráfico por la red interna red_produccion
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-["https://ppc.dpmc.cl", "http://ppc.dpmc.cl"]}
      - PROJECT_NAME=${PROJECT_NAME:-MCDP PPA}
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PATH=/api/
    networks:
      - red_produccion

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    container_name: mcdp_frontend
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PATH=/
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - red_produccion
    depends_on:
      - backend

