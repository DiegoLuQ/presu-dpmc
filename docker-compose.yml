version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mcdp_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mcdp_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_segura}
      MYSQL_USER: ${MYSQL_USER:-mcdp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mcdp_password_segura}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_password_segura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcdp_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-mcdp_user}:${MYSQL_PASSWORD:-mcdp_password_segura}@db:3306/${MYSQL_DATABASE:-mcdp_db}
      JWT_SECRET: ${JWT_SECRET:-cambiar_por_clave_secreta_jwt_produccion_2026}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-ezp8IStyzdPXcdOx_fEuOXZ_2dePRtY98zO61uOVOBY=}
      ALLOW_ORIGINS: '["https://ppc.dpmc.cl", "http://ppc.dpmc.cl", "http://localhost:3000", "http://localhost:3001"]'
      PROJECT_NAME: "MCDP PPA"
    ports:
      - "127.0.0.1:8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: mcdp_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mcdp_phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
    depends_on:
      - db

volumes:
  mysql_data:
