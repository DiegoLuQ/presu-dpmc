# ========================================================
# Configuración Nginx para subdominio: ppc.dpmc.cl
# Copiar este archivo a: /etc/nginx/sites-available/ppc.dpmc.cl
# y crear enlace simbólico:
# ln -s /etc/nginx/sites-available/ppc.dpmc.cl /etc/nginx/sites-enabled/
# ========================================================

# 1. Redirección HTTP a HTTPS y validación Certbot
server {
    listen 80;
    listen [::]:80;
    server_name ppc.dpmc.cl;

    # Ruta para renovación automática de SSL con Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ppc.dpmc.cl;

    # Certificados SSL (Generados por Certbot)
    ssl_certificate /etc/letsencrypt/live/ppc.dpmc.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppc.dpmc.cl/privkey.pem;

    # Parámetros de seguridad SSL recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Tamaño máximo de subida (esencial para importar planillas Excel y adjuntos grandes)
    client_max_body_size 60M;

    # Compresión gzip para mayor velocidad
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Rutas de la API (Backend FastAPI en puerto 8001) ─────────────────
    # Nota: la barra final en "proxy_pass http://127.0.0.1:8001/;" reescribe
    # /api/presupuesto/... -> /presupuesto/... hacia FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Tiempos de espera extendidos para generación de reportes y respuestas de IA
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Desactivar buffering para respuestas en streaming
        proxy_buffering off;
    }

    # ── Rutas del Frontend (Next.js en puerto 3001) ───────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
